services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hc_scan_api
    restart: unless-stopped
    ports:
      - "5002"
    environment:
      - NODE_ENV=production
      - PORT=5002
      - HOST=0.0.0.0
      - STORAGE_ROOT_PATH=/usr/src/app/uploads
      - STORAGE_ROOT=/usr/src/app/uploads
    volumes:
      - /data/hc-scan/uploads:/usr/src/app/uploads
    networks:
      - coolify

networks:
  coolify:
    external: true
